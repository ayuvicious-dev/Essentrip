<style>
:root{--g:#1f5e3b;--btn:#1f5e3b;--g2:#6fb36f;--bg:#f3f8f4;--card:#fff;--tx:#17301f;--mu:#5f7466;--bd:#dbe8de;--rd:#c0392b;--hd:#eaf2e4;--inp:#fff;--hero:#dcebd5;--tile:#e9f2e3;--chip:#eaf2e4;--chipon:#2f4a38;--act:#dcebd9}
[data-theme=dark]{color-scheme:dark;--g:#7fc08f;--btn:#2d7a4d;--bg:#101a14;--card:#18261d;--tx:#e6f0e8;--mu:#9bb3a2;--bd:#2a3d31;--rd:#e57373;--hd:#16241b;--inp:#1d2d22;--hero:#1d3326;--tile:#223a2b;--chip:#223a2b;--chipon:#3d6b4c;--act:#2a4a35}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--hd);color:var(--g);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
header img{width:34px;height:34px}
header h1{font-family:Georgia,"Times New Roman",serif;color:var(--tx);font-size:20px;margin:0;flex:1}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);width:100%;background:var(--inp);color:var(--tx)}
button{background:var(--btn);color:#fff;border:0;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}
button.sm{width:auto;padding:6px 10px;font-size:13px}
button.del{background:transparent;color:var(--rd);padding:4px 8px;width:auto}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
.trip{cursor:pointer}.trip h3{margin:0 0 4px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{background:#fff;color:var(--g);border:1px solid var(--bd)}.tabs button.on{background:var(--g);color:#fff}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item .t{flex:1}.item input[type=checkbox]{width:20px;height:20px;padding:0}
.done{text-decoration:line-through;color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g2)}.bar i.over{background:var(--rd)}
.auth{text-align:center;margin-top:24px}.auth img{width:140px}
.err{color:var(--rd);font-size:13px;min-height:18px}
a{color:var(--g)}

main{padding-bottom:120px}
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(23,48,31,.18);display:flex;align-items:center;justify-content:space-around;padding:8px 6px;z-index:10}
#nav button[data-p]{background:transparent;color:var(--mu);width:auto;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:11px;font-weight:500;border-radius:16px;margin:0 2px}
#nav button[data-p].on{background:var(--act);color:var(--g);font-weight:700}
#nav .gap{flex:0 0 64px}
#fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:54px!important;height:54px;border-radius:50%;padding:0;font-size:28px;line-height:1;background:var(--btn);box-shadow:0 4px 14px rgba(23,48,31,.35);border:3px solid var(--card)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.sheet{background:var(--card);width:100%;max-width:420px;border-radius:20px;padding:18px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.df{position:relative;flex:1;min-width:0}.df .dt,.df .tm{padding-right:44px}
.cal,.clk{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px!important;height:34px;padding:0!important;background:transparent!important;color:var(--tx)!important;display:flex;align-items:center;justify-content:center}
.dp,.tp{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;padding:0;border:0}
.del.ed{color:var(--g)}.del{display:inline-flex;align-items:center}
.hb{width:auto;background:transparent;color:var(--tx);padding:6px;display:inline-flex}
.hero{background:var(--hero);border-radius:20px;padding:14px;text-align:center;margin-bottom:18px}
.hero h2{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0 0 6px}.hero p{color:var(--mu);margin:0 auto 16px;max-width:260px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--tile);border-radius:14px;padding:12px 4px}
.tile b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:28px}.tile span{font-size:12px;color:var(--mu)}
h2.sec{font-family:Georgia,"Times New Roman",serif;font-size:19px;margin:6px 0 12px}
.tc{cursor:pointer}.tch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tch h3{flex:1;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:18px}
.ib{width:36px;height:36px;border-radius:10px;background:var(--chip);color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--chip);color:var(--mu);border-radius:12px;padding:5px 10px;font-size:12px}.chip.on{background:var(--chipon);color:#fff;font-weight:600}
.ab{background:transparent;color:var(--mu);width:auto;padding:7px 9px;display:inline-flex}
.acts{display:flex;align-items:center;gap:2px;margin-top:10px;border-top:1px solid var(--bd);padding-top:6px}.acts .sp{flex:1}
.day{margin-bottom:14px}.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dh b{font-family:Georgia,"Times New Roman",serif;font-size:15px;text-transform:capitalize}
.lnk{background:transparent;color:var(--g);width:auto;padding:4px 8px;font-size:13px}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}
.ev{position:relative;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.ev::before{content:"";position:absolute;left:-23px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--g2);transform:translateY(-50%)}
.ev .tm2{font-weight:700;color:var(--g);min-width:46px;font-size:14px}.ev .t{flex:1;min-width:0}
.empty{color:var(--mu);font-size:13px;padding:2px 0 8px}
.sheet.rc{display:flex;flex-direction:column;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden}
.rb{overflow-y:auto;flex:1;min-height:0;margin-top:4px;padding-right:2px}
.rh{margin:12px 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:15px}
.dg{font-size:12px;color:var(--mu);margin:8px 0 2px;text-transform:capitalize}
.cr{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}.cr:last-child{border:0}
.ct{min-width:42px;color:var(--g);font-weight:600;font-size:13px}.cl{flex:1;min-width:0}.cv{white-space:nowrap;font-size:13px}
.pg label{display:flex;align-items:center;gap:8px;cursor:pointer}.pg input{width:18px;height:18px;padding:0;flex:none}
.pg:not(.showall) label.done{display:none}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
</style>
</head>

    <div class="row"><button type="button" class="ghost" id="ec0">Batal</button><button>Simpan</button></div></form>`;

function openNew() {

    const start = d2iso(o.querySelector('#ns').value), end = d2iso(o.querySelector('#ne').value);

function openRecap(t, k) {
  const o = document.createElement('div'); o.className = 'ov';
  const cr = (l, v = '', c = '') => `<div class="cr">${c ? `<span class="ct">${c}</span>` : ''}<span class="cl">${l}</span>${v ? `<span class="cv">${v}</span>` : ''}</div>`;
  const none = x => `<span class="mu">${x}</span>`;
  const SEC = {
    plan: () => { const by = {}; t.itin.forEach(i => (by[i.date] = by[i.date] || []).push(i)); const ds = Object.keys(by).sort();
      const lb = d => new Date(d + 'T00:00').toLocaleDateString('id-ID', {weekday: 'short', day: 'numeric', month: 'short'});
      return ['Rencana · ' + t.itin.length + ' kegiatan', ds.length ? ds.map(d => (ds.length > 1 ? `<div class="dg">Hari ${dayDiff(d, t.start) + 1} · ${lb(d)}</div>` : '')
        + by[d].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')).map(i => cr(esc(i.title), '', esc(i.time) || '—')).join('')).join('') : none('Belum ada rencana.')]; },
    cost: () => { const tot = sum(t), cs = catStats(t).filter(x => x.b || x.r);
      return ['Biaya', `<div class="mu" style="margin-bottom:4px">Realisasi <b>${rp(tot)}</b> dari ${rp(t.budget)}${t.budget ? ' · ' + (tot > t.budget ? 'lebih ' + rp(tot - t.budget) : 'sisa ' + rp(t.budget - tot)) : ''}</div>`
        + (cs.length ? '<div class="dg">Per kategori (realisasi / anggaran)</div>' + cs.map(x => cr(x.c, `${rp(x.r)} / ${rp(x.b)}`)).join('') : '')
        + (t.exp.length ? '<div class="dg">Rincian realisasi</div>' + t.exp.map(x => cr(`${esc(x.title)} <span class="mu">· ${esc(x.cat)}</span>`, rp(x.amt))).join('') : none('Belum ada realisasi biaya.'))]; },
    pack: () => { const d = t.pack.filter(p => p.done).length;
      return ['Packing · ' + d + '/' + t.pack.length + ' siap', t.pack.length ? `<div class="pg">${t.pack.map(p => `<label class="${p.done ? 'done' : ''}"><input type="checkbox" data-pk="${p.id}" ${p.done ? 'checked' : ''}><span>${esc(p.title)}</span></label>`).join('')}</div><div class="mu pn" style="margin-top:6px"></div>` : none('Daftar kosong.')]; }
  };
  const sec = key => { const [h, body] = SEC[key](); return `<h4 class="rh" data-k="${key}">${h}</h4>${body}`; };
  o.innerHTML = `<div class="sheet rc"><div><h3 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:19px">${esc(t.name)}</h3>
    <div class="mu" style="margin-top:2px">${esc(t.dest)} · ${fd(t.start)} – ${fd(t.end)}</div></div>
    <div class="rb">${k ? sec(k) : ['plan', 'cost', 'pack'].map(sec).join('')}</div>
    <div class="row" style="margin:12px 0 0">${k ? '<button type="button" class="ghost" id="rk">Kelola</button>' : ''}<button type="button" id="rc">Tutup</button></div></div>`;
  document.body.appendChild(o);
  o.onclick = e => { if (e.target === o) o.remove(); };
  o.querySelector('#rc').onclick = () => o.remove();
  const refresh = () => { const pn = o.querySelector('.pn'); if (!pn) return; const pg = o.querySelector('.pg'), d = t.pack.filter(p => p.done).length;
    o.querySelector('h4[data-k="pack"]').textContent = 'Packing · ' + d + '/' + t.pack.length + ' siap';
    pn.innerHTML = (d === t.pack.length ? 'Semua barang sudah siap. ' : '') + (d ? `<a href="#" id="ps">${pg.classList.contains('showall') ? 'Sembunyikan' : 'Tampilkan'} ${d} yang sudah dicentang</a>` : '');
    const ps = pn.querySelector('#ps'); if (ps) ps.onclick = e => { e.preventDefault(); pg.classList.toggle('showall'); refresh(); }; };
  o.querySelectorAll('[data-pk]').forEach(c => c.onchange = () => {
    t.pack = t.pack.map(p => p.id === c.dataset.pk ? {...p, done: c.checked} : p); save(t, {pack: t.pack});
    c.closest('label').classList.toggle('done', c.checked); refresh();
  });
  refresh();
  if (k) o.querySelector('#rk').onclick = () => { o.remove(); cur = t.id; page = k === 'cost' ? 'cost' : 'plan'; render(); k === 'pack' ? $('#pk')?.scrollIntoView() : window.scrollTo(0, 0); };
}

function renderList() {
  const c = {on: 0, up: 0, done: 0}; trips.forEach(t => c[stat(t)]++);
  const ord = {on: 0, up: 1, done: 2}, lbl = {on: 'Berlangsung', up: 'Akan datang', done: 'Selesai'};
  const list = [...trips].sort((a, b) => ord[stat(a)] - ord[stat(b)] || (stat(a) === 'done' ? b.start.localeCompare(a.start) : a.start.localeCompare(b.start)));
  const card = t => {
    const s = stat(t), n = todayISO(), days = dayDiff(t.end, t.start) + 1, tot = sum(t), pct = t.budget ? Math.min(100, tot / t.budget * 100) : 0;
    const cd = s === 'up' ? 'H-' + dayDiff(t.start, n) : s === 'on' ? 'Hari ke-' + (dayDiff(n, t.start) + 1) : '';
    return `<div class="card tc" data-open="${t.id}">
      <div class="tch"><span class="ib">${ic(P.pin, 20)}</span><h3>${esc(t.name)}</h3><button class="ab" data-ex aria-label="Rekap">${ic(P.ex, 20)}</button></div>
      <div class="chips"><span class="chip on">${esc(t.dest)}</span><span class="chip">${fd(t.start)} – ${fd(t.end)}</span></div>
      <div class="chips"><span class="chip on">${lbl[s]}</span><span class="chip">${days} hari</span>${cd ? `<span class="chip">${cd}</span>` : ''}</div>
      <div class="mu">Biaya ${rp(tot)} / ${rp(t.budget)}</div><div class="bar"><i class="${t.budget && tot > t.budget ? 'over' : ''}" style="width:${pct}%"></i></div>
      <div class="acts"><button class="ab" data-go="plan" aria-label="Rencana">${ic(P.cal)}</button><button class="ab" data-go="cost" aria-label="Biaya">${ic(P.wal)}</button><button class="ab" data-go="pack" aria-label="Packing">${ic(P.chk)}</button><span class="sp"></span><button class="ab" data-rm aria-label="Hapus" style="color:var(--rd)">${ic(P.tr)}</button></div></div>`;
  };
  A.innerHTML = `<div class="hero">
    <div class="tiles"><div class="tile"><b>${c.up}</b><span>akan datang</span></div><div class="tile"><b>${c.on}</b><span>berlangsung</span></div><div class="tile"><b>${c.done}</b><span>selesai</span></div></div></div>
    <h2 class="sec">Perjalanan kamu</h2>` + (list.length ? list.map(card).join('') : '<p class="mu" style="text-align:center">Belum ada trip. Tekan tombol <b>+</b> untuk membuat yang pertama!</p>');
  A.querySelectorAll('.tc').forEach(el => { const id = el.dataset.open;
    el.onclick = () => { cur = id; page = 'plan'; render(); window.scrollTo(0, 0); };
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.stopPropagation(); openRecap(trips.find(x => x.id === id), b.dataset.go); });
    el.querySelector('[data-ex]').onclick = e => { e.stopPropagation(); openRecap(trips.find(x => x.id === id)); };
    el.querySelector('[data-rm]').onclick = async e => { e.stopPropagation(); if (confirm('Hapus trip ini beserta isinya?')) { if (cur === id) cur = null; await deleteDoc(tripRef(id)); } };
  });
}
const sum = t => (t.exp || []).reduce((a, x) => a + x.amt, 0);

function addPlan(t, date) {

    if (!dd) return alert('Isi tanggal dengan format dd/mm/yyyy.');
    if (dd < t.start || dd > t.end) return alert('Tanggal harus di dalam rentang trip (' + fd(t.start) + ' – ' + fd(t.end) + ').');
    if (tt === null) return alert('Jam tidak valid. Gunakan format 24 jam, mis. 07:30.');
    save(t, {itin: [...t.itin, {id: uid(), date: dd, time: tt, title: m.querySelector('#an').value.trim()}]}); return true;
  });
}

function tabPlan(t, el) {
  const byDay = {}; t.itin.forEach(i => (byDay[i.date] = byDay[i.date] || []).push(i));
  const n = dayDiff(t.end, t.start) + 1; let dates = Object.keys(byDay);
  if (n <= 21) { dates = []; for (let k = 0; k < n; k++) { const d = new Date(t.start + 'T00:00'); d.setDate(d.getDate() + k); dates.push(d.toLocaleDateString('sv')); }
    Object.keys(byDay).forEach(d => { if (!dates.includes(d)) dates.push(d); }); }
  dates.sort();
  const lab = d => new Date(d + 'T00:00').toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'short'});
  const ev = i => `<div class="ev"><span class="tm2">${esc(i.time) || '—'}</span><div class="t"><b>${esc(i.title)}</b></div><button class="del ed" data-e="${i.id}" aria-label="Edit">${PEN}</button><button class="del" data-x="${i.id}" aria-label="Hapus">✕</button></div>`;
  const day = d => { const L = (byDay[d] || []).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    const no = d >= t.start && d <= t.end ? 'Hari ' + (dayDiff(d, t.start) + 1) + ' · ' : '';
    return `<div class="day"><div class="dh"><b>${no}${lab(d)}</b><button class="lnk" data-add="${d}">+ Tambah</button></div><div class="tl">${L.length ? L.map(ev).join('') : '<div class="empty">Belum ada kegiatan.</div>'}</div></div>`; };
  el.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px"><h2 class="sec" style="margin:0">Itinerary</h2><button class="sm" id="add">+ Kegiatan</button></div>${dates.length ? dates.map(day).join('') : '<p class="mu">Belum ada kegiatan.</p>'}`;
  const today = todayISO(), dflt = today >= t.start && today <= t.end ? today : t.start;
  el.querySelector('#add').onclick = () => addPlan(t, dflt);
  el.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addPlan(t, b.dataset.add));
  el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { if (confirm('Hapus kegiatan ini?')) save(t, {itin: t.itin.filter(i => i.id !== b.dataset.x)}); });
  el.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const it = t.itin.find(i => i.id === b.dataset.e);
    openEdit('Edit kegiatan', `<div class="row">${dField('ed', it.date, t.start, t.end)}${tField('eh', it.time)}</div><div class="row"><input id="en" value="${esc(it.title)}" required></div>`, m => {
      const dd = d2iso(m.querySelector('#ed').value), tt = t2v(m.querySelector('#eh').value);
      if (!dd) return alert('Isi tanggal dengan format dd/mm/yyyy.');
      if (dd < t.start || dd > t.end) return alert('Tanggal harus di dalam rentang trip (' + fd(t.start) + ' – ' + fd(t.end) + ').');
      if (tt === null) return alert('Jam tidak valid. Gunakan format 24 jam, mis. 07:30.');
      save(t, {itin: t.itin.map(i => i.id === it.id ? {...i, date: dd, time: tt, title: m.querySelector('#en').value.trim()} : i)}); return true;
    }); });
}

const CATS = ['Transport', 'Penginapan', 'Makan', 'Tiket', 'Lainnya'];
const catStats = t => CATS.map(c => ({c, b: +(t.catBudget || {})[c] || 0, r: t.exp.filter(x => x.cat === c).reduce((a, x) => a + x.amt, 0)}));

function tabCost(t, el) {
  const tot = sum(t), pct = t.budget ? Math.min(100, tot / t.budget * 100) : 0, st = catStats(t), alloc = st.reduce((a, x) => a + x.b, 0);
  const note = x => x.b ? (x.r > x.b ? `<span style="color:var(--rd)">lebih ${rp(x.r - x.b)}</span>` : `sisa ${rp(x.b - x.r)}`) : (x.r ? 'tanpa anggaran' : 'belum ada anggaran');
  el.innerHTML = `<div class="card"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div class="mu">Realisasi</div><b style="font-size:20px">${rp(tot)}</b> <span class="mu">dari budget ${rp(t.budget)}</span></div><button class="ab" id="bg" aria-label="Atur budget">${PEN}</button></div>
    <div class="bar"><i class="${t.budget && tot > t.budget ? 'over' : ''}" style="width:${pct}%"></i></div>
    <div class="mu">${t.budget ? (tot > t.budget ? 'Melebihi budget ' + rp(tot - t.budget) : 'Sisa ' + rp(t.budget - tot)) : 'Budget belum diatur'}${alloc ? ' · teralokasi ' + rp(alloc) + (t.budget && alloc > t.budget ? ' (melebihi budget total)' : '') : ''}</div></div>
    <div class="card"><b>Budget vs Realisasi</b>${st.map(x => `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:8px"><span>${x.c}</span><span class="mu">${rp(x.r)} / ${rp(x.b)}</span></div>
      <div class="bar"><i class="${(x.b && x.r > x.b) || (!x.b && x.r) ? 'over' : ''}" style="width:${x.b ? Math.min(100, x.r / x.b * 100) : (x.r ? 100 : 0)}%"></i></div><div class="mu" style="font-size:12px">${note(x)}</div></div>`).join('')}</div>
    <form class="card" id="f"><b>Catat realisasi biaya</b><div class="row" style="margin-top:8px"><input id="n" placeholder="Keterangan" required></div>
    <div class="row"><input id="a" type="number" min="0" placeholder="Jumlah (Rp)" required>
    <select id="c">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
    <div class="row"><button>Catat realisasi</button></div></form>
    <div class="card">${t.exp.length ? t.exp.map(x => `<div class="item"><div class="t"><b>${esc(x.title)}</b><div class="mu">${esc(x.cat)}</div></div><span>${rp(x.amt)}</span><button class="del ed" data-e="${x.id}" aria-label="Edit">${PEN}</button><button class="del" data-x="${x.id}">✕</button></div>`).join('') : '<span class="mu">Belum ada realisasi biaya.</span>'}</div>`;
  el.querySelector('#bg').onclick = () => openEdit('Atur budget', `<div class="mu">Budget total trip</div><div class="row"><input id="bt" type="number" min="0" value="${t.budget || ''}" placeholder="Rp"></div>
    <div class="mu" style="margin:8px 0 4px">Anggaran per kategori</div>${CATS.map((c, i) => `<div class="row" style="align-items:center"><span style="flex:0 0 100px">${c}</span><input id="bc${i}" type="number" min="0" value="${(t.catBudget || {})[c] || ''}" placeholder="0"></div>`).join('')}`, m => {
    const cb = {}; CATS.forEach((c, i) => { cb[c] = +m.querySelector('#bc' + i).value || 0; });
    save(t, {budget: +m.querySelector('#bt').value || 0, catBudget: cb}); return true;
  });
  el.querySelector('#f').onsubmit = e => { e.preventDefault(); save(t, {exp: [...t.exp, {id: uid(), title: $('#n').value.trim(), amt: +$('#a').value, cat: $('#c').value}]}); };
  el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => save(t, {exp: t.exp.filter(x => x.id !== b.dataset.x)}));
  el.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const x = t.exp.find(q => q.id === b.dataset.e);
    openEdit('Edit realisasi', `<div class="row"><input id="en" value="${esc(x.title)}" required></div><div class="row"><input id="ea" type="number" min="0" value="${x.amt}" required><select id="ec">${CATS.map(c => `<option ${c === x.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></div>`, m => {
      save(t, {exp: t.exp.map(q => q.id === x.id ? {...x, title: m.querySelector('#en').value.trim(), amt: +m.querySelector('#ea').value, cat: m.querySelector('#ec').value} : q)}); return true;
    }); });
}

function renderSet() {
  A.innerHTML = `<div class="card"><div class="mu">Akun</div><b>${esc(user.email)}</b>
    <div class="mu" style="margin-top:4px">${trips.length} trip tersimpan</div></div>
  <div class="card"><div class="row"><button class="ghost" id="rp">Kirim tautan reset password</button></div>
    <div class="row"><button id="lo" style="background:var(--rd)">Keluar</button></div></div>
  <p class="mu" style="text-align:center">Essentrip v1</p>`;
  $('#rp').onclick = async () => { try { await sendPasswordResetEmail(auth, user.email); alert('Tautan reset password dikirim ke ' + user.email); } catch (x) { alert(errMsg(x)); } };
  $('#lo').onclick = () => signOut(auth);
}

function tabPack(t, el) {
  const d = t.pack.filter(p => p.done).length;
  el.innerHTML = `<form class="card" id="f"><div class="row"><input id="pn" placeholder="Barang yang dibawa" required><button style="flex:0 0 90px">Tambah</button></div></form>
    <div class="card"><div class="mu">${d}/${t.pack.length} siap</div><div class="bar"><i style="width:${t.pack.length ? d / t.pack.length * 100 : 0}%"></i></div>${t.pack.length ? t.pack.map(p => `<div class="item"><input type="checkbox" data-c="${p.id}" ${p.done ? 'checked' : ''}><span class="t ${p.done ? 'done' : ''}">${esc(p.title)}</span><button class="del ed" data-e="${p.id}" aria-label="Edit">${PEN}</button><button class="del" data-x="${p.id}">✕</button></div>`).join('') : '<span class="mu">Daftar kosong.</span>'}</div>`;
  el.querySelector('#f').onsubmit = e => { e.preventDefault(); save(t, {pack: [...t.pack, {id: uid(), title: el.querySelector('#pn').value.trim(), done: false}]}); };
  el.querySelectorAll('[data-c]').forEach(c => c.onchange = () => save(t, {pack: t.pack.map(p => p.id === c.dataset.c ? {...p, done: c.checked} : p)}));
  el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => save(t, {pack: t.pack.filter(p => p.id !== b.dataset.x)}));
  el.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const x = t.pack.find(q => q.id === b.dataset.e);
    openEdit('Edit barang', `<div class="row"><input id="en" value="${esc(x.title)}" required></div>`, m => {
      save(t, {pack: t.pack.map(q => q.id === x.id ? {...q, title: m.querySelector('#en').value.trim()} : q)}); return true;
    }); });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
