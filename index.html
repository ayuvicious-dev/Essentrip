<style>
:root{--g:#1f5e3b;--btn:#1f5e3b;--g2:#6fb36f;--bg:#f3f8f4;--card:#fff;--tx:#17301f;--mu:#5f7466;--bd:#dbe8de;--rd:#c0392b;--hd:#eaf2e4;--inp:#fff;--hero:#dcebd5;--tile:#e9f2e3;--chip:#eaf2e4;--chipon:#2f4a38;--act:#dcebd9;--pb:#b7d2bb}
[data-theme=dark]{color-scheme:dark;--g:#7fc08f;--btn:#2d7a4d;--bg:#101a14;--card:#18261d;--tx:#e6f0e8;--mu:#9bb3a2;--bd:#2a3d31;--rd:#e57373;--hd:#16241b;--inp:#1d2d22;--hero:#1d3326;--tile:#223a2b;--chip:#223a2b;--chipon:#3d6b4c;--act:#2a4a35;--pb:#3a5a46}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--hd);color:var(--g);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
header img{width:34px;height:34px}
header h1{font-family:Georgia,"Times New Roman",serif;color:var(--tx);font-size:calc(20px*var(--fs,1));margin:0;flex:1}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);width:100%;background:var(--inp);color:var(--tx)}
button{background:var(--btn);color:#fff;border:0;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}
button.sm{width:auto;padding:6px 10px;font-size:calc(13px*var(--fs,1))}
button.del{background:transparent;color:var(--rd);padding:4px 8px;width:auto}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
.mu{color:var(--mu);font-size:calc(13px*var(--fs,1))}
.trip{cursor:pointer}.trip h3{margin:0 0 4px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{background:#fff;color:var(--g);border:1px solid var(--bd)}.tabs button.on{background:var(--g);color:#fff}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item .t{flex:1}.item input[type=checkbox]{width:20px;height:20px;padding:0}
.done{text-decoration:line-through;color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g2)}.bar i.over{background:var(--rd)}
.auth{text-align:center;margin-top:24px}.auth img{width:140px}
.err{color:var(--rd);font-size:calc(13px*var(--fs,1));min-height:18px}
a{color:var(--g)}

main{padding-bottom:120px}
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(23,48,31,.18);display:flex;align-items:center;justify-content:space-around;padding:8px 6px;z-index:10}
#nav button[data-p]{background:transparent;color:var(--mu);width:auto;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:10px;min-width:0;font-weight:500;border-radius:16px;margin:0 1px}
#nav button[data-p].on{background:var(--act);color:var(--g);font-weight:700}
#nav .gap{flex:0 0 64px}
@media (max-width:640px){#nav{left:0;right:0;bottom:0;max-width:none;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(23,48,31,.14);border-top:1px solid var(--bd);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}}
#fab{position:relative;top:-22px;flex:none;margin:0 4px;width:54px!important;height:54px;border-radius:50%;padding:0;font-size:calc(28px*var(--fs,1));line-height:1;background:var(--btn);box-shadow:0 4px 14px rgba(23,48,31,.35);border:3px solid var(--card)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.sheet{background:var(--card);width:100%;max-width:420px;border-radius:20px;padding:18px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.df{position:relative;flex:1;min-width:0}.df .dt,.df .tm{padding-right:44px}
.cal,.clk{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px!important;height:34px;padding:0!important;background:transparent!important;color:var(--tx)!important;display:flex;align-items:center;justify-content:center}
.dp,.tp{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;padding:0;border:0}
.del.ed{color:var(--g)}.del{display:inline-flex;align-items:center}
.hb{width:auto;background:transparent;color:var(--tx);padding:6px;display:inline-flex}
.hero{background:var(--hero);border-radius:20px;padding:14px;text-align:center;margin-bottom:18px}
.hero h2{font-family:Georgia,"Times New Roman",serif;font-size:calc(26px*var(--fs,1));margin:0 0 6px}.hero p{color:var(--mu);margin:0 auto 16px;max-width:260px;font-size:calc(14px*var(--fs,1))}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--tile);border-radius:14px;padding:12px 4px}
.tile b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:calc(28px*var(--fs,1))}.tile span{font-size:calc(12px*var(--fs,1));color:var(--mu)}
h2.sec{font-family:Georgia,"Times New Roman",serif;font-size:calc(19px*var(--fs,1));margin:6px 0 12px}
.tc{cursor:pointer}.tch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tch h3{flex:1;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:calc(18px*var(--fs,1))}
.ib{width:36px;height:36px;border-radius:10px;background:var(--chip);color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--chip);color:var(--mu);border-radius:12px;padding:5px 10px;font-size:calc(12px*var(--fs,1))}.chip.on{background:var(--chipon);color:#fff;font-weight:600}
.ab{background:transparent;color:var(--mu);width:auto;padding:7px 9px;display:inline-flex}
.acts{display:flex;align-items:center;gap:2px;margin-top:10px;border-top:1px solid var(--bd);padding-top:6px}.acts .sp{flex:1}
.day{margin-bottom:14px}.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dh b{font-family:Georgia,"Times New Roman",serif;font-size:calc(15px*var(--fs,1));text-transform:capitalize}
.lnk{background:transparent;color:var(--g);width:auto;padding:4px 8px;font-size:calc(13px*var(--fs,1))}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}
.ev{position:relative;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.ev::before{content:"";position:absolute;left:-23px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--g2);transform:translateY(-50%)}
.ev .tm2{font-weight:700;color:var(--g);min-width:46px;font-size:calc(14px*var(--fs,1))}.ev .t{flex:1;min-width:0}
.empty{color:var(--mu);font-size:calc(13px*var(--fs,1));padding:2px 0 8px}
.sheet.rc{display:flex;flex-direction:column;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden}
.rb{overflow-y:auto;flex:1;min-height:0;margin-top:4px;padding-right:2px}
.rh{margin:12px 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:calc(15px*var(--fs,1))}
.dg{font-size:calc(12px*var(--fs,1));color:var(--mu);margin:8px 0 2px;text-transform:capitalize}
.cr{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bd);font-size:calc(14px*var(--fs,1))}.cr:last-child{border:0}
.ct{min-width:42px;color:var(--g);font-weight:600;font-size:calc(13px*var(--fs,1))}.cl{flex:1;min-width:0}.cv{white-space:nowrap;font-size:calc(13px*var(--fs,1))}
.pg label{display:flex;align-items:center;gap:8px;cursor:pointer}.pg input{width:18px;height:18px;padding:0;flex:none}
.pg:not(.showall) label.done{display:none}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:calc(14px*var(--fs,1))}

textarea{resize:vertical;min-height:76px}
.fl{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.fl::-webkit-scrollbar{display:none}
.fb{flex:none;width:46px;height:46px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--g);border:1.5px solid var(--pb)}
.fb.on{background:var(--chipon);border-color:var(--chipon);color:#fff}
.fp{flex:none;width:auto;padding:10px 16px;border-radius:999px;background:transparent;color:var(--tx);border:1.5px solid var(--pb);font-weight:500;font-size:calc(14px*var(--fs,1));white-space:nowrap}
.fp.on{background:var(--chipon);border-color:var(--chipon);color:#fff}
.sb{position:relative;margin-bottom:14px}.sb svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.sb input{padding:13px 14px 13px 44px;border-radius:14px;border-color:var(--pb);-webkit-appearance:none;appearance:none}
.ac{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.ach{display:flex;align-items:center;gap:12px}.ach h3{flex:1;min-width:0;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:calc(19px*var(--fs,1));overflow-wrap:anywhere}
.ar{display:flex;align-items:center;gap:2px;margin:6px 0 8px -6px}.ar.bt{margin:4px 0 0 -6px}.ar .sp{flex:1}
.ab.fv{color:var(--g)}
.nt{color:var(--mu);font-size:calc(13px*var(--fs,1));margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vd{width:1px;height:18px;background:var(--bd);margin:0 4px}
.tcl{cursor:pointer}
.dhd{display:flex;align-items:center;gap:6px;margin:0 0 14px 0}.dhd .hb{margin-left:-6px;flex:none}
/* ukuran font lebih kecil */
body{font-size:calc(14px*var(--fs,1))}
header h1{font-size:calc(18px*var(--fs,1))}
h2.sec{font-size:calc(17px*var(--fs,1))}
.tch h3,.ach h3{font-size:calc(16px*var(--fs,1))}
.hero h2{font-size:calc(22px*var(--fs,1))}.tile b{font-size:calc(24px*var(--fs,1))}
.mu{font-size:calc(12px*var(--fs,1))}.chip{font-size:calc(11px*var(--fs,1))}.nt{font-size:calc(12px*var(--fs,1))}
.cr,.ev .tm2{font-size:calc(13px*var(--fs,1))}
input,select,button,textarea{padding:9px 12px}
.fb{width:40px;height:40px}
.fp{font-size:calc(13px*var(--fs,1));padding:8px 14px}
.sb input{padding:11px 14px 11px 42px}
.ac{padding:14px}
.ac.cp{display:flex;align-items:center;gap:10px;padding:9px 4px 9px 10px;margin-bottom:8px;border-radius:14px;cursor:pointer}
.cm{flex:1;min-width:0}.ct2{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:calc(15px*var(--fs,1));overflow-wrap:anywhere;line-height:1.25}
.cm .mu{margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.tm3{color:var(--g)}
.ac.cp .ab{padding:7px}
.tg .chv{display:flex;align-items:center;justify-content:center;width:30px;height:30px;color:var(--mu);flex:none;transition:transform .2s}.tg.open .chv{transform:rotate(90deg)}
.tgb{margin:-2px 0 10px 18px;padding-left:8px;border-left:2px solid var(--bd)}.tgb .ac.cp{margin-bottom:6px}.tgb .go{margin:2px 0 0}
.mapov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.maph{display:flex;align-items:center;gap:2px;padding:8px 12px;background:var(--hd);border-bottom:1px solid var(--bd)}
.maph h2{flex:1;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:calc(18px*var(--fs,1));color:var(--tx)}
.mapw{position:relative;flex:1;min-height:0}
.mapv{position:absolute;inset:0;overflow:hidden;background:#dfe7dc;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapv img.t{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;padding:0;border:0;border-radius:0;background:#e6ece3;pointer-events:none;-webkit-user-drag:none}
.mapm{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2979ff;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none;z-index:3}
.mapa{position:absolute;border-radius:50%;background:rgba(41,121,255,.15);border:1px solid rgba(41,121,255,.4);pointer-events:none;z-index:2}
.mapc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:4}
.mapc button{width:42px;height:42px;padding:0;border-radius:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.mapat{position:absolute;left:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);color:#333;padding:1px 6px;border-radius:6px;z-index:4;pointer-events:none}
.mapf{padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd)}
.maps{font-size:calc(11px*var(--fs,1));color:var(--mu);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapp{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#e53935;color:#fff;font:700 12px/20px sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);z-index:3;pointer-events:none}
.mapl{position:absolute;height:3px;margin-top:-1px;background:#e53935;transform-origin:0 50%;z-index:2;pointer-events:none;opacity:.9}
.mapr{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:calc(13px*var(--fs,1));color:var(--tx);max-height:58%;overflow-y:auto}
.mapn{width:22px;height:22px;border-radius:50%;background:#e53935;color:#fff;font:700 12px/22px sans-serif;text-align:center;flex:none}
.mapi{width:36px;height:36px;padding:0;flex:none;background:var(--chip);color:var(--g);display:flex;align-items:center;justify-content:center;border-radius:10px}
.mapx{background:none;color:var(--g);width:auto;padding:2px 6px;font-size:calc(12px*var(--fs,1));border:0}
.maph .hb.on{background:var(--chip);color:var(--g);border-radius:10px}
.mapq{display:flex;align-items:center;gap:6px;margin-bottom:6px}.mapq input{flex:1;min-width:0;padding:8px 10px}
.mapo{display:block;width:100%;text-align:left;margin-top:4px;font-weight:500;font-size:calc(12px*var(--fs,1));overflow-wrap:anywhere;color:var(--tx);background:var(--card);border:1px solid var(--bd);padding:7px 10px}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:hidden}
.mapt button{flex:1;min-width:0;background:var(--chip);color:var(--tx);border:1.5px solid transparent;border-radius:10px;padding:6px 4px;font-weight:500;font-size:calc(11px*var(--fs,1));display:flex;flex-direction:column;align-items:center;width:auto}.mapt button.on{border-color:var(--g);background:var(--act)}.mapt button i{font-style:normal;color:var(--mu);font-size:calc(10px*var(--fs,1))}
.mapt{display:flex;gap:8px;margin-top:6px}.mapt span{flex:1;background:var(--chip);border-radius:10px;padding:6px 4px;text-align:center;font-size:calc(11px*var(--fs,1));color:var(--mu);display:flex;flex-direction:column}.mapt b{font-size:calc(13px*var(--fs,1));color:var(--tx)}
.mapb{display:flex;gap:8px}.mapb button{flex:1;min-width:0}
.dgh{font-size:calc(12px*var(--fs,1));font-weight:600;color:var(--mu);margin:14px 4px 6px;text-transform:capitalize}
.card.st{border-radius:20px;padding:18px}
.st h3{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:calc(16px*var(--fs,1))}
.st p{margin:0 0 10px;color:var(--mu);line-height:1.6}
.abt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.abt div{background:var(--tile);border:1px solid var(--bd);border-radius:14px;padding:12px}
.abt span{display:block;font-size:calc(12px*var(--fs,1));color:var(--mu);margin-bottom:4px}
.abt b{font-family:Georgia,"Times New Roman",serif;font-size:calc(16px*var(--fs,1))}
.st .em{font-size:calc(14px*var(--fs,1));margin:0 0 10px;overflow-wrap:anywhere}
.sta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.out{width:auto;background:transparent;color:var(--tx);border:1.5px solid var(--pb);border-radius:14px;padding:12px 22px;font-weight:700;font-size:calc(15px*var(--fs,1))}
.st .lb{font-size:12px;color:var(--mu);margin:0 0 6px}
.seg{display:flex;gap:6px;margin:0 0 14px}.seg:last-child{margin-bottom:0}
.seg button{flex:1;background:transparent;color:var(--tx);border:1.5px solid var(--pb);border-radius:12px;padding:10px 8px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--chipon);border-color:var(--chipon);color:#fff}
.calh{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.calh h2{flex:1;margin:0;text-align:center;text-transform:capitalize}
.cgw{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px 8px;margin-bottom:12px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cwd{text-align:center;font-size:calc(11px*var(--fs,1));color:var(--mu);font-weight:600;padding:0 0 6px}
.cd{position:relative;min-height:64px;display:flex;flex-direction:column;align-items:center;padding:4px 0;cursor:pointer;user-select:none}
.cd.b{background:var(--act)}
.cd.bl{border-top-left-radius:12px;border-bottom-left-radius:12px}
.cd.br{border-top-right-radius:12px;border-bottom-right-radius:12px}
.cd .n{width:26px;height:26px;line-height:23px;text-align:center;border-radius:50%;border:1.5px solid transparent;font-size:calc(13px*var(--fs,1))}
.cd.s .n{background:var(--chipon);border-color:var(--chipon);color:#fff}
.cd.t .n,.cd.t.s .n{background:transparent;border-color:var(--g);color:inherit;font-weight:700}
.cdot{position:absolute;top:6px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--g)}
.tn{position:absolute;left:3px;z-index:1;height:13px;line-height:13px;font-size:calc(10px*var(--fs,1));font-weight:600;color:var(--g);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ck label{display:flex;align-items:center;gap:8px;margin:7px 0;cursor:pointer}
.ck input{width:18px;height:18px;padding:0;flex:none}
</style>

function openRecap(t, k) {

  document.body.appendChild(o);

  o.querySelector('#rc').onclick = () => o.remove();
  const refresh = () => { const pn = o.querySelector('.pn'); if (!pn) return; const pg = o.querySelector('.pg'), d = t.pack.filter(p => p.done).length;
    o.querySelector('h4[data-k="pack"]').textContent = 'Packing · ' + d + '/' + t.pack.length + ' siap';
    pn.innerHTML = (d === t.pack.length ? 'Semua barang sudah siap. ' : '') + (d ? `<a href="#" id="ps">${pg.classList.contains('showall') ? 'Sembunyikan' : 'Tampilkan'} ${d} yang sudah dicentang</a>` : '');

}

function readAct(t, m) {

let pf = {tid: null, day: 'all', fav: false, sx: 0};
function tabPlan(t, el) {
  if (pf.tid !== t.id) pf = {tid: t.id, day: 'all', fav: false, sx: 0};
  const n = dayDiff(t.end, t.start) + 1, dates = [];
  if (n <= 60) for (let k = 0; k < n; k++) { const d = new Date(t.start + 'T00:00'); d.setDate(d.getDate() + k); dates.push(d.toLocaleDateString('sv')); }
  t.itin.forEach(i => { if (!dates.includes(i.date)) dates.push(i.date); });
  dates.sort();
  if (pf.day !== 'all' && !dates.includes(pf.day)) pf.day = 'all';
  const NOTE = ic('<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6M9 17h6"/>', 12);
  const card = i => { const c = acat(i);
    return `<div class="ac cp" data-id="${i.id}"><span class="ib">${ic(ACI[c], 18)}</span>
    <div class="cm"><div class="ct2">${esc(i.title)}</div><div class="mu"><b class="tm3">${esc(i.time) || 'Tanpa jam'}</b> · ${c}${i.note ? ' · ' + NOTE : ''}</div></div>
    <button class="ab ${i.fav ? 'fv' : ''}" data-a="fav" aria-label="Favorit">${i.fav ? icf(STAR) : ic(STAR)}</button><button class="ab" data-a="open" aria-label="Detail">${ic(P.ex, 18)}</button></div>`; };
  el.innerHTML = `<div class="fl" id="fl"><button class="fb" data-f="all" aria-label="Semua kegiatan">${ic(GRID, 20)}</button><button class="fb" data-f="fav" aria-label="Favorit">${ic(STAR, 20)}</button>${dates.map(d => `<button class="fp" data-d="${d}">${dlab(t, d)}</button>`).join('')}</div><div id="pl"></div>`;
  const fl = el.querySelector('#fl'), pl = el.querySelector('#pl');
  const paint = () => {
    fl.querySelector('[data-f=all]').classList.toggle('on', pf.day === 'all' && !pf.fav);
    fl.querySelector('[data-f=fav]').classList.toggle('on', pf.fav);
    fl.querySelectorAll('[data-d]').forEach(b => b.classList.toggle('on', b.dataset.d === pf.day));
    const L = t.itin.filter(i => (pf.day === 'all' || i.date === pf.day) && (!pf.fav || i.fav))
      .sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99:99').localeCompare(b.time || '99:99'));
    let html = '', last = null, sec = null;
    const hasPrep = pf.day === 'all' && L.some(i => i.date < t.start);
    L.forEach(i => { if (hasPrep) { const k = i.date < t.start ? 'prep' : 'trip'; if (k !== sec) { sec = k; html += `<h2 class="sec" style="margin:${html ? 22 : 6}px 0 4px">${k === 'prep' ? 'Persiapan Keberangkatan' : 'Perjalanan'}</h2>`; } }
      if (pf.day === 'all' && dates.length > 1 && i.date !== last) { html += `<div class="dgh">${inTrip(t, i.date) || i.date < t.start ? dlab(t, i.date) + ' · ' : ''}${sd(i.date)}</div>`; last = i.date; } html += card(i); });
    pl.innerHTML = L.length ? html : `<p class="mu" style="text-align:center;margin:28px 0">${t.itin.length ? 'Tidak ada kegiatan yang cocok.' : 'Belum ada kegiatan.<br>Tekan tombol <b>+</b> untuk menambah kegiatan.'}</p>`;
  };
  fl.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.f === 'all') { pf.day = 'all'; pf.fav = false; }
    else if (b.dataset.f === 'fav') pf.fav = !pf.fav;
    else if (b.dataset.d) pf.day = pf.day === b.dataset.d ? 'all' : b.dataset.d;
    paint(); };
  fl.onscroll = () => { pf.sx = fl.scrollLeft; };
  pl.onclick = e => { const c = e.target.closest('.ac'); if (!c) return;
    const it = t.itin.find(i => i.id === c.dataset.id); if (!it) return;
    const b = e.target.closest('[data-a]');
    if (b && b.dataset.a === 'fav') save(t, {itin: t.itin.map(i => i.id === it.id ? {...i, fav: !i.fav} : i)});
    else openDetail(t, it); };
  paint(); fl.scrollLeft = pf.sx;
}

// Kelola kategori biaya: tambah, ubah nama, hapus
function manageCats() {
  const o = document.createElement('div'); o.className = 'ov';
  const row = (c = '') => `<div class="row cr2" data-o="${esc(c)}"><input class="cn" placeholder="Nama kategori" maxlength="30" value="${esc(c)}"><button type="button" class="del" data-rm aria-label="Hapus kategori">✕</button></div>`;
  o.innerHTML = `<form class="sheet"><b>Kelola kategori biaya</b>
    <div class="mu" style="margin:6px 0 8px">Ubah nama langsung pada kolom. Biaya yang sudah tercatat ikut berganti kategori. Kategori yang dihapus akan dipindah ke kategori lain.</div>
    <div id="cl">${CATS.map(row).join('')}</div>
    <div class="row"><button type="button" class="ghost" id="ca">+ Tambah kategori</button></div>
    <div class="row"><button type="button" class="ghost" id="cx">Batal</button><button>Simpan</button></div></form>`;
  document.body.appendChild(o);
  o.onclick = e => { if (e.target === o) o.remove(); };
  o.querySelector('#cx').onclick = () => o.remove();
  const cl = o.querySelector('#cl');
  cl.onclick = e => { const b = e.target.closest('[data-rm]'); if (!b) return;
    if (cl.children.length <= 1) return alert('Minimal harus ada satu kategori.');
    b.closest('.cr2').remove(); };
  o.querySelector('#ca').onclick = () => { cl.insertAdjacentHTML('beforeend', row('')); cl.lastElementChild.querySelector('input').focus(); };
  o.querySelector('form').onsubmit = e => { e.preventDefault();
    const rows = [...cl.querySelectorAll('.cr2')].map(r => ({o: r.dataset.o, n: r.querySelector('.cn').value.trim()})).filter(r => r.n);
    if (!rows.length) return alert('Minimal harus ada satu kategori.');
    const names = rows.map(r => r.n.toLowerCase());
    if (new Set(names).size !== names.length) return alert('Nama kategori tidak boleh sama.');
    const nl = rows.map(r => r.n), map = {};
    rows.forEach(r => { if (r.o) map[r.o] = r.n; });
    const fb = nl.includes('Lainnya') ? 'Lainnya' : nl[0];
    CATS.forEach(c => { if (!(c in map)) map[c] = fb; });
    trips.forEach(tr => { const ex = tr.exp.map(x => { const n = x.cat in map ? map[x.cat] : (nl.includes(x.cat) ? x.cat : fb); return n === x.cat ? x : {...x, cat: n}; });
      if (ex.some((x, i) => x !== tr.exp[i])) save(tr, {exp: ex}); });
    CATS = nl; try { localStorage.setItem('et-cats', JSON.stringify(CATS)); } catch {}
    o.remove(); render();
  };
}

const addDays = (iso, k) => { const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + k); return d.toLocaleDateString('sv'); };

  const dur = dayDiff(t.end, t.start), ns0 = todayISO();
  openEdit('Duplikat perjalanan', `<div class="row"><input id="dn" placeholder="Nama trip" required value="${esc(t.name + ' (2)')}"></div>
    <div class="mu" style="margin:0 0 4px">Tanggal trip baru</div>

    <label><input type="checkbox" id="dk2" checked><span>Packing list (${t.pack.length}, centang direset)</span></label>
    <label><input type="checkbox" id="dk3" checked><span>Anggaran (${rp(t.budget)})</span></label></div>

    const ns = d2iso(m.querySelector('#dsa').value), ne = d2iso(m.querySelector('#dse').value);
    if (!ns || !ne) return alert('Isi tanggal dengan format dd/mm/yyyy.');
    if (ne < ns) return alert('Tanggal selesai harus setelah tanggal mulai.');
    const off = dayDiff(ns, t.start), clamp = d => { const x = addDays(d, off); return x > ne ? ne : x; };
    const nt = {name: m.querySelector('#dn').value.trim(), dest: t.dest, start: ns, end: ne,
      budget: m.querySelector('#dk3').checked ? (t.budget || 0) : 0,
      itin: m.querySelector('#dk1').checked ? t.itin.map(i => ({...i, id: uid(), date: clamp(i.date), fav: false})) : [],

  });
}

// ---- Kalender trip ----
const CAL_DAYS = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
let cal = {y: new Date().getFullYear(), m: new Date().getMonth(), sel: null, exp: {}};
function renderCal() {
  const today = todayISO(), y = cal.y, m = cal.m, ym = `${y}-${String(m + 1).padStart(2, '0')}`;
  if (!cal.sel) cal.sel = today;
  const tripsOn = d => trips.filter(t => d >= t.start && d <= t.end).sort((a, b) => a.start.localeCompare(b.start) || (a.created || 0) - (b.created || 0));
  const actsOn = d => trips.flatMap(t => t.itin.filter(i => i.date === d).map(i => ({t, i})));
  const isTrip = d => trips.some(t => d >= t.start && d <= t.end);
  const first = (new Date(y, m, 1).getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate();
  const ms = ym + '-01', me = `${ym}-${String(nd).padStart(2, '0')}`;
  const inM = trips.filter(t => t.start <= me && t.end >= ms).sort((a, b) => a.start.localeCompare(b.start) || (a.created || 0) - (b.created || 0));
  const lane = {}, placed = [];
  inM.forEach(t => { let k = 0; while (placed.some(p => lane[p.id] === k && p.start <= t.end && p.end >= t.start)) k++; lane[t.id] = k; placed.push(t); });
  let cells = '';
  for (let k = 0; k < first; k++) cells += '<div></div>';
  for (let d = 1; d <= nd; d++) {
    const di = `${ym}-${String(d).padStart(2, '0')}`, c = (first + d - 1) % 7, ts = tripsOn(di), blk = ts.length > 0;
    const cls = 'cd' + (blk ? ' b' : '') + (blk && (c === 0 || !isTrip(addDays(di, -1))) ? ' bl' : '') + (blk && (c === 6 || !isTrip(addDays(di, 1))) ? ' br' : '') + (di === today ? ' t' : '') + (di === cal.sel ? ' s' : '');
    const names = ts.filter(t => lane[t.id] < 2 && (di === t.start || c === 0 || d === 1)).map(t => {
      const n = Math.min(7 - c, dayDiff(t.end, di) + 1, nd - d + 1);
      return `<span class="tn" style="bottom:${3 + lane[t.id] * 14}px;width:calc(${n * 100}% - 6px)">${esc(t.name)}</span>`; }).join('');
    cells += `<div class="${cls}" data-d="${di}"><span class="n">${d}</span>${actsOn(di).length ? '<span class="cdot"></span>' : ''}${names}</div>`;
  }
  const sel = cal.sel, st = tripsOn(sel), sa = actsOn(sel).sort((a, b) => (a.i.time || '99:99').localeCompare(b.i.time || '99:99'));
  const lab = new Date(sel + 'T00:00').toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  const sorted = sa;
  const gids = [...st.map(t => t.id), ...sorted.map(x => x.t.id).filter((id, k, a) => a.indexOf(id) === k && !st.some(t => t.id === id))];
  const arow = ({t, i}) => `<div class="ac cp" data-it="${i.id}" data-t="${t.id}"><span class="ib">${ic(ACI[acat(i)], 18)}</span><div class="cm"><div class="ct2">${esc(i.title)}</div><div class="mu"><b class="tm3">${esc(i.time) || 'Tanpa jam'}</b> · ${acat(i)}</div></div></div>`;
  const grow = id => { const t = trips.find(x => x.id === id), acts = sorted.filter(x => x.t.id === id), key = sel + '|' + id, open = !!cal.exp[key] && acts.length > 0;
    const inR = sel >= t.start && sel <= t.end, n = dayDiff(sel, t.start) + 1, tot = dayDiff(t.end, t.start) + 1;
    const meta = [esc(t.dest), inR ? `Hari ${n} dari ${tot}` : '', sel === t.start ? 'Mulai' : '', sel === t.end ? 'Selesai' : '', acts.length ? acts.length + ' kegiatan' : ''].filter(Boolean).join(' · ');
    return `<div class="tg${open ? ' open' : ''}" data-key="${key}"><div class="ac cp" ${acts.length ? 'data-tg' : `data-tr="${t.id}"`}><span class="ib">${ic(P.pin, 18)}</span><div class="cm"><div class="ct2">${esc(t.name)}</div><div class="mu">${meta}</div></div>${acts.length ? `<span class="chv">${ic('<path d="m9 18 6-6-6-6"/>', 18)}</span>` : ''}</div>
      ${acts.length ? `<div class="tgb"${open ? '' : ' hidden'}>${acts.map(arow).join('')}<button class="ghost sm go" data-tr="${t.id}">Buka rencana trip</button></div>` : ''}</div>`; };
  A.innerHTML = `<div class="calh"><button class="hb" id="calp" aria-label="Bulan sebelumnya">${ic('<path d="m15 18-6-6 6-6"/>', 22)}</button>
    <h2 class="sec">${new Date(y, m, 1).toLocaleDateString('id-ID', {month: 'long', year: 'numeric'})}</h2>
    <button class="ghost sm" id="calt">Hari ini</button>
    <button class="hb" id="caln" aria-label="Bulan berikutnya">${ic('<path d="m9 18 6-6-6-6"/>', 22)}</button></div>
    <div class="cgw"><div class="cg">${CAL_DAYS.map(d => `<div class="cwd">${d}</div>`).join('')}${cells}</div></div>
    <div class="dgh" style="margin-top:4px;color:var(--tx);font-size:calc(14px*var(--fs,1))">${lab}</div>
    ${gids.length ? '<div class="dgh">Perjalanan</div>' + gids.map(grow).join('') : ''}
    ${!gids.length ? '<p class="mu" style="text-align:center;margin:20px 0">Tidak ada trip atau kegiatan pada hari ini.</p>' : ''}`;
  const go = (yy, mm) => { cal.y = yy; cal.m = mm; const k = `${yy}-${String(mm + 1).padStart(2, '0')}`; cal.sel = today.slice(0, 7) === k ? today : k + '-01'; renderCal(); };
  $('#calp').onclick = () => { const d = new Date(y, m - 1, 1); go(d.getFullYear(), d.getMonth()); };
  $('#caln').onclick = () => { const d = new Date(y, m + 1, 1); go(d.getFullYear(), d.getMonth()); };
  $('#calt').onclick = () => { const d = new Date(); go(d.getFullYear(), d.getMonth()); };
  A.querySelectorAll('.cd[data-d]').forEach(e => e.onclick = () => { cal.sel = e.dataset.d; renderCal(); });
  A.querySelectorAll('[data-tg]').forEach(e => e.onclick = () => { const g = e.parentNode, o = g.classList.toggle('open'); g.querySelector('.tgb').hidden = !o; cal.exp[g.dataset.key] = o; });
  A.querySelectorAll('[data-tr]').forEach(e => e.onclick = () => { cur = e.dataset.tr; page = 'plan'; planOpen = true; render(); window.scrollTo(0, 0); });
  A.querySelectorAll('[data-it]').forEach(e => e.onclick = () => { const t = trips.find(x => x.id === e.dataset.t), it = t && t.itin.find(i => i.id === e.dataset.it); if (it) openDetail(t, it); });
}

  el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => save(t, {pack: t.pack.filter(p => p.id !== b.dataset.x)}));
  el.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const x = t.pack.find(q => q.id === b.dataset.e);
    openEdit('Edit barang', `<div class="row"><input id="en" value="${esc(x.title)}" required></div>`, m => {
      save(t, {pack: t.pack.map(q => q.id === x.id ? {...q, title: m.querySelector('#en').value.trim()} : q)}); return true;
    }); });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
</body>
</html>
